components:
  schemas:
    PostResponse:
      type: object
      properties:
        resource:
          type: string
        bearer_methods_supported:
          type: array
          items:
            type: string
        scopes_supported:
          type: array
          items:
            type: string
    GetApiClustersResponse:
      type: object
      properties:
        id:
          type: string
          description: Cluster identifier.
        name:
          type: string
          description: Cluster name.
        status:
          type: string
          description: Cluster connection status (connected, disconnected, unknown).
    PostApiClustersKubeconfigRequest:
      type: object
      properties:
        kubeconfig:
          type: string
          description: The kubeconfig file to upload.
        registerAgent:
          type: string
          description: Set to "true" to create an SGAgent CR.
        clusterName:
          type: string
          description: Name for the SGAgent (defaults to the first context).
      required:
      - kubeconfig
    PostApiClustersKubeconfigResponse:
      type: object
      properties:
        contexts:
          type: array
          description: List of context names that were registered.
        agentCreated:
          type: boolean
          description: Indicates whether an SGAgent was created.
    DeleteApiClustersIdResponse:
      type: object
      properties:
        deleted:
          type: string
          description: The identifier of the deleted cluster.
    GetApiClustersIdHealthResponse:
      type: object
      properties:
        id:
          type: string
          description: Cluster identifier.
        status:
          type: string
          description: Cluster connection status.
    GetHealthzResponse:
      type: object
      properties:
        status:
          type: string
          description: Health status, e.g., "ok".
